<html lang="pl">
<head>

<title>Dokumenty, wygląd 1: Ciepły · mObywatel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  html { font-size: var(--tekst, 112.5%); }
  body { margin: 0; font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.5; color: #1A1F27; background: #fff; }
  :focus-visible { outline: 3px solid #1A1A1A; outline-offset: 3px; }
  .narzedzia { display: none; }
  /* Na komputerze: ramka telefonu, wnętrze 390 × 844 px */
  @media (min-width: 31em) and (min-height: 46em) {
    body { background: #E3E6EC; display: flex; flex-direction: column; align-items: center; padding: 12px; gap: 12px; }
    .narzedzia { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 20px; max-width: 900px; }
    .ekran { --wysokosc-ekranu: 100%; width: 410px; height: min(864px, calc(100dvh - 140px)); overflow-y: auto;
      border: 10px solid #1A1F27; border-radius: 40px; box-shadow: 0 10px 40px rgba(0,0,0,.25); background: #fff;
      scrollbar-width: none; } /* jak w telefonie: bez paska przewijania */
    .ekran::-webkit-scrollbar { display: none; }
  }
  .narzedzia p { margin: 0; font-weight: 700; }
  .narzedzia fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .narzedzia legend { float: left; margin-right: 6px; }
  .narzedzia label { display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 12px;
    background: #fff; border: 2px solid #6B7A8C; border-radius: 999px; cursor: pointer; }
  .narzedzia input { width: 20px; height: 20px; accent-color: #123A6B; }
  .narzedzia a { color: #123A6B; font-weight: 700; display: inline-flex; align-items: center; min-height: 48px; }
</style>
</head>
<body>
  <div class="narzedzia">
    <p>Dokumenty — wygląd 1: Ciepły</p>
    <fieldset>
      <legend>Rozmiar tekstu:</legend>

      <label><input type="radio" name="rozmiar" value="duzy"> Duży</label>
      <label><input type="radio" name="rozmiar" value="bardzo-duzy"> Bardzo duży</label>
    </fieldset>
    <fieldset>
      <legend>Motyw:</legend>
      <label><input type="radio" name="motyw" value="jasny"> Jasny</label>
      <label><input type="radio" name="motyw" value="ciemny"> Ciemny</label>
      <label><input type="radio" name="motyw" value="kontrast"> Wysoki kontrast</label>
    </fieldset>
    <a href="../porownanie.html">Porównanie wariantów</a>
  </div>
  <div class="ekran" id="ekran" role="region" aria-label="Podgląd ekranu Dokumenty"></div>
  <noscript><p>Ten podgląd potrzebuje włączonego JavaScriptu.</p></noscript>

  <script src="dokumenty-wspolne.js"></script>
  <script src="wyglad-1.js"></script>

    Dokumenty.zamontuj(document.getElementById('ekran'), '1');
    Dokumenty.podlaczPrzelaczniki();
  </script>
